name: jev-debug
# 临时诊断：Apple 芯片上 Metal（GPU）与纯 CPU 的判分输出对比
on: workflow_dispatch
jobs:
  metal-vs-cpu:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 下载
        run: |
          mkdir -p l && curl -fsSL https://github.com/ggml-org/llama.cpp/releases/download/b8944/llama-b8944-bin-macos-arm64.tar.gz | tar xz -C l --strip-components=1
          curl -fsSL -o m.gguf https://huggingface.co/chaoliangUNSW/Jev-Style-0.8B-Decision-v3-GGUF/resolve/main/Jev-Style-0.8B-Decision-v3-Q4_K_M.gguf
          sysctl -n machdep.cpu.brand_string; ./l/llama-server --version 2>&1 | tail -2
      - name: 对比
        run: |
          for mode in "default:" "cpu:-ngl 0" "cpu-device:--device none" "metal-noflash:-fa off"; do
            name=${mode%%:*}; args=${mode#*:}
            ./l/llama-server -m m.gguf --host 127.0.0.1 --port 9001 -c 2048 --no-webui $args > s-$name.log 2>&1 &
            pid=$!
            for i in $(seq 1 60); do curl -s http://127.0.0.1:9001/health | grep -q ok && break; sleep 1; done
            echo "===== $name ($args)"; grep -E -i "offload|metal|backend|flash" s-$name.log | head -6
            node tests/judge-probe.mjs http://127.0.0.1:9001 || true
            kill $pid; wait $pid 2>/dev/null; sleep 2
          done
